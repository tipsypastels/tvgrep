[package]
name = "tvgrep"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
camino = "1.2.1"
clap = { version = "4.5.48", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
enum-fun = "0.1.6"
futures = "0.3.31"
kstring = { version = "2.0.2", features = ["arc"] }
ratatui = "0.29.0"
reqwest = "0.12.23"
scraper = "0.24.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite"] }
tokio = { version = "1.47.1", features = ["full"] }
