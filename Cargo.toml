[package]
name = "tvgrep"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.11", features = ["serde"] }
anyhow = "1.0.96"
camino = { version = "1.1.9", features = ["serde", "serde1"] }
clap = { version = "4.5.30", features = ["derive"] }
console = "0.15.10"
dirs = "6.0.0"
futures = "0.3.31"
indexmap = { version = "2.7.1", features = ["serde"] }
indicatif = "0.17.11"
kstring = { version = "2.0.2", features = ["arc", "serde"] }
parking_lot = "0.12.3"
reqwest = "0.12.15"
scraper = "0.22.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
tokio = { version = "1.43.0", features = ["full"] }
